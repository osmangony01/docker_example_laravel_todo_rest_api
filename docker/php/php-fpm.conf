[global]
pid = /run/php-fpm.pid
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0666

user = www-data
group = www-data

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
pm.max_requests = 500

access.log = /proc/self/fd/2
catch_workers_output = yes

clear_env = no
