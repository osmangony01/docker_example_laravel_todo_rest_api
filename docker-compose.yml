services:
    # Laravel Application (PHP-FPM)
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel_todo_app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
            - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
        networks:
            - todo-network
        depends_on:
            db:
                condition: service_healthy
        environment:
            - APP_ENV=production
            - APP_DEBUG=false
            - DB_CONNECTION=mysql
            - DB_HOST=db
            - DB_PORT=3306
            - DB_DATABASE=todo_curd_rest_api
            - DB_USERNAME=user
            - DB_PASSWORD=user
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t && nc -z localhost 9000"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: laravel_todo_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - todo-network
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/ping"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    # MySQL Database
    db:
        image: mysql:8.0
        container_name: laravel_todo_db
        restart: unless-stopped
        ports:
            - "3307:3306"
        environment:
            MYSQL_DATABASE: todo_curd_rest_api
            MYSQL_USER: user
            MYSQL_PASSWORD: user
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - mysql_data:/var/lib/mysql
            - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - todo-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    # phpMyAdmin (optional)
    phpmyadmin:
        image: phpmyadmin:latest
        container_name: laravel_todo_phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_USER: user
            PMA_PASSWORD: user
        networks:
            - todo-network
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

networks:
    todo-network:
        driver: bridge

volumes:
    mysql_data:
        driver: local
